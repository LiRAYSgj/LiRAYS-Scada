[package]
name = "scada"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "lirays-scada"
path = "src/main.rs"

[[bin]]
name = "lirays"
path = "src/bin/liraysctl.rs"

[features]
default = ["simulator", "udp"]
simulator = []
udp = []

[dependencies]
futures-util = "0.3.32"
fjall = "3.1.13"
log = "0.4.29"
prost = "0.14.3"
lirays-scada-proto = "0.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9"
tokio = { version = "1.54.1", features = ["full"]}
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
rcgen = "0.14"
uuid = { version = "1.21.0", features = ["v4"]}
winnow = "1.0"
env_logger = "0.11.6"
tokio-util = "0.7.13"
include_dir = "0.7.4"
axum = { version = "0.8.8", features = ["ws"] }
mime_guess = "2.0.5"
sea-orm = { version = "2.0", features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres", "sqlx-mysql"] }
url = "2.5.9"
utoipa = { version = "6", features = ["chrono"] }
argon2 = "0.6"
rand = "0.10"
base64 = "0.22"
axum-extra = { version = "0.12", features = ["cookie"] }
chrono = { version = "0.4", features = ["clock"] }
time = "0.3"
dashmap = "6.1"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
rpassword = "7.3"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
